# RachBase partner JWT verification key. The site-controller `api` facade verifies the
# BFF's short-lived RS256 JWT with this PUBLIC key. It is NOT secret (a public key), but is
# delivered as a Secret so it mounts read-only at /etc/rachbase/oauth/public.pem.
#
# RachBase provides the actual PEM (the public half of the BFF's OAUTH_PRIVATE_KEY). Replace
# the placeholder below, then:  kubectl apply -f rachbase-oauth-secret.example.yaml
#
# Quick create from a file instead:
#   kubectl -n spaceark-site-requests create secret generic rachbase-oauth \
#     --from-file=public.pem=./rachbase-oauth-public.pem
apiVersion: v1
kind: Secret
metadata:
  name: rachbase-oauth
  namespace: spaceark-site-requests
type: Opaque
stringData:
  public.pem: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_RACHBASE_OAUTH_PUBLIC_KEY
    -----END PUBLIC KEY-----
